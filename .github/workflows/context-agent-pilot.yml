name: Context and agent pilot

on:
  push:
    branches:
      - feat/google-context-pilot
    paths:
      - "src/app/api/context/**"
      - "src/app/api/v1/connections/**"
      - "src/app/api/v1/moments/**"
      - "src/lib/context/**"
      - "src/lib/db/schema/context.ts"
      - ".github/workflows/context-agent-pilot.yml"
  pull_request:
    paths:
      - "src/app/api/context/**"
      - "src/app/api/v1/connections/**"
      - "src/app/api/v1/moments/**"
      - "src/lib/context/**"
      - "src/lib/db/schema/context.ts"
      - ".github/workflows/context-agent-pilot.yml"

permissions:
  contents: read

jobs:
  typecheck-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # The repo tsconfig currently targets ES2017 while an existing unrelated
      # test uses the RegExp dotAll flag (ES2018). Keep that config cleanup out
      # of this pilot while still typechecking the complete tree.
      - run: npx tsc --noEmit --target ES2018
      - run: npm test
